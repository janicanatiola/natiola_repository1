<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f6ef">
    <title>Sign in | Rooted</title>
    <style>
        :root {
            color-scheme: light;
            --forest: #1c5239;
            --forest-dark: #123c29;
            --leaf: #47754e;
            --paper: #f2f6ef;
            --white: #fffefa;
            --ink: #26382d;
            --muted: #738076;
            --line: #dce5da;
            --serif: Georgia, "Times New Roman", serif;
            --sans: "Trebuchet MS", "Segoe UI", sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 28px 20px;
            color: var(--ink);
            background-color: var(--paper);
            background-image: radial-gradient(#d9e5d3 0.8px, transparent 0.8px);
            background-size: 22px 22px;
            font-family: var(--sans);
        }

        .login-layout {
            display: grid;
            width: min(960px, 100%);
            min-height: 570px;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
            border: 1px solid rgba(18, 60, 41, 0.08);
            border-radius: 14px;
            background: var(--white);
            box-shadow: 0 24px 70px rgba(28, 67, 47, 0.14);
            animation: arrive 600ms ease both;
        }

        .welcome-panel {
            position: relative;
            display: flex;
            min-height: 570px;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            padding: 38px;
            background: var(--forest-dark);
            color: #f4f6ed;
        }

        .welcome-panel::before,
        .welcome-panel::after {
            position: absolute;
            border: 1px solid rgba(220, 237, 211, 0.22);
            border-radius: 50%;
            content: "";
            pointer-events: none;
        }

        .welcome-panel::before {
            right: -160px;
            bottom: -165px;
            width: 400px;
            height: 400px;
            box-shadow: 0 0 0 30px rgba(220, 237, 211, 0.035), 0 0 0 60px rgba(220, 237, 211, 0.025);
        }

        .welcome-panel::after {
            right: -87px;
            bottom: -92px;
            width: 250px;
            height: 250px;
        }

        .brand {
            position: relative;
            z-index: 1;
            display: inline-flex;
            width: fit-content;
            align-items: center;
            gap: 10px;
            color: #f4f6ed;
            font-family: var(--serif);
            font-size: 23px;
            font-weight: 700;
            text-decoration: none;
        }

        .brand-mark {
            width: 33px;
            height: 33px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(244, 246, 237, 0.55);
            border-radius: 50% 50% 50% 8px;
            color: #d6e69a;
            font-family: var(--sans);
            font-size: 18px;
            transform: rotate(-10deg);
        }

        .welcome-copy {
            position: relative;
            z-index: 1;
            max-width: 350px;
            margin: 42px 0;
        }

        .eyebrow {
            margin: 0 0 15px;
            color: #c6d8b2;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.7px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: #f5f6ed;
            font-family: var(--serif);
            font-size: clamp(42px, 5vw, 58px);
            font-weight: 400;
            line-height: 1.03;
        }

        .welcome-copy > p:last-child {
            max-width: 290px;
            margin: 18px 0 0;
            color: #d1dfd0;
            font-size: 13px;
            line-height: 1.75;
        }

        .panel-note {
            position: relative;
            z-index: 1;
            margin: 0;
            color: #c6d8c5;
            font-size: 11px;
        }

        .form-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px clamp(28px, 5vw, 62px);
        }

        .form-content { width: 100%; max-width: 360px; }

        .form-content h2 {
            margin: 0 0 8px;
            color: var(--forest-dark);
            font-family: var(--serif);
            font-size: 35px;
            font-weight: 400;
        }

        .form-intro { margin: 0 0 28px; color: var(--muted); font-size: 12px; line-height: 1.6; }
        .field { margin-bottom: 18px; }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: #405246;
            font-size: 11px;
            font-weight: 700;
        }

        .field input {
            width: 100%;
            height: 46px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 4px;
            outline: none;
            background: #fff;
            color: var(--ink);
            font: inherit;
            font-size: 12px;
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }

        .field input::placeholder { color: #9ba79d; }
        .field input:focus { border-color: var(--leaf); box-shadow: 0 0 0 3px rgba(71, 117, 78, 0.11); }
        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 62px; }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 10px;
            padding: 5px;
            border: 0;
            background: transparent;
            color: var(--leaf);
            cursor: pointer;
            font: inherit;
            font-size: 10px;
            font-weight: 700;
            transform: translateY(-50%);
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 0 0 21px;
            font-size: 10px;
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin: 0;
            color: #59685d;
            font-weight: 400;
        }

        .remember input { margin: 0; accent-color: var(--leaf); }
        .form-options a, .signup-note a { color: var(--leaf); font-weight: 700; text-decoration: none; }
        .form-options a:hover, .signup-note a:hover { text-decoration: underline; }

        .submit-button {
            width: 100%;
            min-height: 47px;
            border: 0;
            border-radius: 4px;
            background: var(--forest);
            color: white;
            cursor: pointer;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            transition: background 150ms ease, transform 150ms ease;
        }

        .submit-button:hover { background: var(--forest-dark); }
        .submit-button:active { transform: translateY(1px); }

        .status-message {
            min-height: 16px;
            margin: 10px 0 0;
            color: var(--leaf);
            font-size: 10px;
            line-height: 1.55;
        }

        .signup-note { margin: 17px 0 0; color: var(--muted); font-size: 11px; text-align: center; }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(9px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 650px) {
            body { padding: 16px; }
            .login-layout { width: min(440px, 100%); min-height: 0; grid-template-columns: 1fr; }
            .welcome-panel { min-height: 205px; padding: 24px 26px; }
            .welcome-copy { margin: 25px 0 17px; }
            .welcome-copy h1 { font-size: 39px; }
            .welcome-copy > p:last-child { margin-top: 9px; font-size: 12px; }
            .panel-note { display: none; }
            .form-panel { padding: 32px 26px 35px; }
            .form-content h2 { font-size: 30px; }
            .form-intro { margin-bottom: 23px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <main class="login-layout">
        <section class="welcome-panel" aria-labelledby="welcome-title">
            <a class="brand" href="home.html"><span class="brand-mark" aria-hidden="true">&#10047;</span> rooted</a>
            <div class="welcome-copy">
                <p class="eyebrow">A little space to grow</p>
                <h1 id="welcome-title">Good to see you again.</h1>
                <p>Sign in to return to your plants, your plans, and all the good things growing.</p>
            </div>
            <p class="panel-note">Grow at your own pace.</p>
        </section>

        <section class="form-panel" aria-labelledby="signin-title">
            <div class="form-content">
                <h2 id="signin-title">Welcome back</h2>
                <p class="form-intro">Enter your details below to sign in to your account.</p>
                <form id="login-form">
                    <div class="field">
                        <label for="email">Email address</label>
                        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <div class="password-wrap">
                            <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                            <button class="password-toggle" id="password-toggle" type="button" aria-controls="password" aria-pressed="false">Show</button>
                        </div>
                    </div>
                    <div class="form-options">
                        <label class="remember" for="remember"><input id="remember" name="remember" type="checkbox"> Remember me</label>
                        <a href="#forgot-password" id="forgot-link">Forgot password?</a>
                    </div>
                    <button class="submit-button" type="submit">Sign in</button>
                    <p class="status-message" id="status-message" role="status" aria-live="polite"></p>
                </form>
                <p class="signup-note">New to Rooted? <a href="#create-account" id="signup-link">Create an account</a></p>
            </div>
        </section>
    </main>

    <script>
        const passwordInput = document.getElementById("password");
        const passwordToggle = document.getElementById("password-toggle");
        const loginForm = document.getElementById("login-form");
        const statusMessage = document.getElementById("status-message");

        passwordToggle.addEventListener("click", () => {
            const isVisible = passwordInput.type === "text";
            passwordInput.type = isVisible ? "password" : "text";
            passwordToggle.textContent = isVisible ? "Show" : "Hide";
            passwordToggle.setAttribute("aria-pressed", String(!isVisible));
        });

        loginForm.addEventListener("submit", (event) => {
            event.preventDefault();
            statusMessage.textContent = "Your details are ready. Connect a backend to sign in securely.";
        });

        document.getElementById("forgot-link").addEventListener("click", (event) => {
            event.preventDefault();
            statusMessage.textContent = "Password recovery needs to be connected to an account service.";
        });

        document.getElementById("signup-link").addEventListener("click", (event) => {
            event.preventDefault();
            statusMessage.textContent = "Account creation needs to be connected to an account service.";
        });
    </script>
</body>
</html>
